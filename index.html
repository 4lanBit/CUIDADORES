<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Registro de cuidadores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--bg:#1d1450;--ink:#14123a;--soft:#e1dcff;--ok:#157a32;--r:22px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:700 1.25rem/1.45 Nunito,system-ui,sans-serif}
#app{max-width:960px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:14px;padding:16px 0}
.bar{flex:1;height:18px;background:#ffffff2e;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd23f;border-radius:10px;transition:width .4s}
.pill{border:0;background:#ffffff2e;color:#fff;border-radius:30px;min-height:52px;padding:0 20px;font:inherit;font-size:1.05rem;cursor:pointer}
main{flex:1;padding:6px 0 20px}
.chip{display:inline-block;background:#ffffff1f;border-radius:30px;padding:6px 16px;color:var(--soft);font-size:1rem}
h1.q{font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.2;margin:.5em 0;font-weight:900}
.hint{color:var(--soft);margin:14px 0 20px;font-size:1.15rem}
.opts{display:grid;gap:14px}.opts.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}.opts.col{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:18px;min-height:92px;padding:16px 22px;background:#fff;color:var(--ink);border:4px solid #fff;border-radius:var(--r);font:inherit;font-size:1.4rem;font-weight:800;text-align:left;cursor:pointer;box-shadow:0 5px 0 #0004}
.opt:active{transform:translateY(3px)}
.mark{flex:none;width:2.4rem;height:2.4rem;border:4px solid var(--ink);display:grid;place-items:center;font-size:1.6rem;color:transparent}
.mark.ci{border-radius:50%}.mark.sq{border-radius:8px}
.opt.sel{background:var(--ok);border-color:#ffd23f;color:#fff}.opt.sel .mark{background:#fff;border-color:#fff;color:var(--ok)}
.inp{width:100%;font:inherit;font-size:1.7rem;font-weight:800;padding:18px 20px;border-radius:var(--r);border:4px solid transparent;background:#fff;color:var(--ink)}
.inp{scroll-margin:90px 0}body.typing main{padding-bottom:50vh}body.typing footer{position:static}
.inp:focus{border-color:#ffd23f;outline:0}.search{margin-bottom:16px}
.dates{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:12px}
.num{display:flex;gap:12px;align-items:center}.num .pill{width:90px;height:90px;font-size:2.6rem;border-radius:var(--r);padding:0}.num .inp{text-align:center;font-size:2.6rem}
footer{position:sticky;bottom:0;padding:18px 0;background:linear-gradient(#1d145000,var(--bg) 30%)}
footer .row{display:flex;gap:12px}.need{margin:0 0 10px;color:#ffd23f;text-align:center;font-size:1.1rem}
.btn{min-height:76px;padding:0 34px;border:0;border-radius:var(--r);font:inherit;font-size:1.5rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0004}
.next{background:#1fa044;color:#fff;flex:1}.next:disabled{background:#ffffff1f;color:#fff9;box-shadow:none;cursor:default}
.back{background:#ffffff2e;color:#fff;min-width:150px}
.say{min-height:56px;font-size:1.1rem;padding:0 22px;background:#ffffff2e;color:#fff;box-shadow:none;margin-top:4px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60dvh;gap:12px}
.big{font-size:clamp(2.2rem,7vw,4rem);font-weight:900;line-height:1.1;margin:0}
.step{font-size:5rem;margin:0}.warn{background:#ffd23f;color:var(--ink);padding:12px 18px;border-radius:var(--r)}
details{background:#ffffff14;border-radius:var(--r);padding:14px 18px;margin:18px 0;text-align:left;width:100%}
details p{margin:.5em 0;font-weight:600}details b{color:#ffd23f}
:focus-visible{outline:4px solid #ffd23f;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div>

 la persona con discapacidad?","sec":13},{"k":"q77","n":77,"t":"77. ¿Qué tipo de emprendimiento?","tipo":"select_unico","ob":true,"op":["Emprendimiento de alto impacto","Emprendimiento social","Emprendimiento de personas en condición de vulnerabilidad","Intraemprendimientos o emprendimientos corporativos","Emprendimientos de alto nivel tecnológico","Emprendimientos culturales","Emprendimientos verdes","Emprendimientos solidarios","Emprendimientos de beneficios e interés colectivo","Emprendimiento o empresa mujer"],"col":"77. ¿Qué tipo de emprendimiento?","sec":13}],"sec":{"1":"DATOS DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","2":"DATOS DE AUTORECONOCIMIENTO DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","3":"UBICACIÓN GEOGRÁFICA DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","4":"NIVEL DE EDUCACIÓN DEL CUIDADOR O ASISTENTE PERSONAL OK","5":"ADSCRIPCIÓN AL SISBEN DEL HOGAR DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","6":"CARACTERÍSTICAS POBLACIONALES DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","7":"SERVICIOS DE SALUD Y ACCESO DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL","8":"FORMACIÓN ESPECÍFICA EN ACTIVIDADES DE CUIDADO POR PARTE DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","9":"BENEFICIOS SOCIALES CON LOS QUE CUENTA LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","10":"CARACTERÍSTICAS DE LA VIVIENDA DEL HOGAR DE LA PERSONA CUIDADORA O ASISTENTE PERSONAL OK","11":"INFORMACIÓN SOBRE LA DINÁMICA DEL CUIDADO","12":"FACTORES PERSONALES Y DEL ENTORNO RELACIONADOS CON EL ROL DE CUIDADOR O ASISTENTE PERSONAL OK","13":"RECONOCIMIENTO DE LA ACTIVIDAD DE CUIDADO O ASISTENCIA PERSONAL OK"},"cond":{"26":[25,"Sí"],"29":[28,"No"],"37":[35,"No"],"39":[38,"Sí"],"41":[40,"Sí"],"46":[45,"No existe parentesco"],"52":[51,"Sí"],"55":[54,"Sí"],"57":[56,"Sí"],"58":[56,"Sí"],"61":[60,"Sí"],"63":[62,"SI"],"65":[64,"Sí"],"68":[67,"Sí"],"69":[67,"Sí"],"71":[70,"Sí"],"72":[70,"Sí"],"77":[76,"Sí"]}};
const $=s=>document.querySelector(s), esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const Q=D.q, C=D.c, ALL=[...C,...Q], by={}, byN={}; ALL.forEach(i=>by[i.k]=i); Q.forEach(q=>byN[q.n]=q);
const SEC=D.sec, SH=['▲','◆','●','■'], NIN=/^ningun[oa]\b/i;
let ans={}, cur='welcome', zoom=0, sending=false;
const secName=n=>{let t=(n===0?'Identificación y soporte legal':SEC[n]).replace(/\s+OK$/,'');t=t.toLowerCase();return t[0].toUpperCase()+t.slice(1)};
const vis=q=>{const c=D.cond[q.n];if(!c)return true;const p=byN[c[0]];return vis(p)&&ans[p.k]===c[1]};
const clean=()=>Q.forEach(q=>{if(!vis(q)&&q.k in ans)delete ans[q.k]});
function seq(){const s=['welcome','i0',...C.map(c=>c.k)];for(let n=1;n<=13;n++){s.push('i'+n);Q.filter(q=>q.sec===n&&vis(q)).forEach(q=>s.push(q.k))}return [...s,'review']}
const valid=it=>{const v=ans[it.k];if(v===undefined||(Array.isArray(v)?!v.length:String(v).trim()===''))return false;if(it.n===20)return /\S+@\S+\.\S+/.test(v);if(it.n===19)return String(v).replace(/\D/g,'').length>=7;return true};
const has=it=>{const v=ans[it.k];return Array.isArray(v)?v.length>0:v!==undefined&&String(v).trim()!==''};
function go(k){if(document.activeElement)document.activeElement.blur();cur=k;render();scrollTo(0,0)}
function step(d){const s=seq(),i=s.indexOf(cur);if(s[i+d])go(s[i+d])}
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-CO';u.rate=.9;speechSynthesis.speak(u)}catch(e){}};

const PIN={8:'COLOMBIA',9:'COLOMBIA',13:'ANTIOQUIA',14:'MEDELLÍN'}; // opción que aparece de primera
function optsHtml(it,f=''){const v=ans[it.k],multi=it.tipo==='checkbox',fn=norm(f);
 const pin=PIN[it.n],h=it.op.map((o,i)=>[o,i]).filter(([o])=>norm(o).includes(fn)).sort((x,y)=>(y[0]===pin)-(x[0]===pin)).map(([o,i])=>{const sel=multi?(v||[]).includes(o):v===o;
  return `<button class="opt${sel?' sel':''}" data-a="opt" data-i="${i}" role="${multi?'checkbox':'radio'}" aria-checked="${sel}"><span class="mark ${multi?'sq':'ci'}">✓</span><span>${esc(o)}</span></button>`}).join('');
 return h||'<p class="hint">No encontramos resultados. Pruebe con otra palabra.</p>'}
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'], dparts={};
const dsel=(id,ph,arr,c)=>`<select class="inp" data-d="${id}" aria-label="${ph}"><option value="">${ph}</option>${arr.map(([v,l])=>`<option value="${v}"${v===c?' selected':''}>${l}</option>`).join('')}</select>`;
function dateView(it){const [y='',m='',d='']=(ans[it.k]||'').split('-'),p=dparts[it.k]=dparts[it.k]||{y,m,d},Y=new Date().getFullYear();
 return `<div class="dates">${dsel('d','Día',Array.from({length:31},(_,i)=>[String(i+1).padStart(2,'0'),i+1]),p.d)}${dsel('m','Mes',MES.map((l,i)=>[String(i+1).padStart(2,'0'),l]),p.m)}${dsel('y','Año',Array.from({length:81},(_,i)=>[String(Y-i),Y-i]),p.y)}</div>`}

function qView(it){const v=ans[it.k],n=it.sec;
 const hint={checkbox:'Marque todas las respuestas que correspondan. Cuando termine, toque “Siguiente”.',select_unico:'Toque su respuesta y luego “Siguiente”.',radio:'Toque su respuesta y luego “Siguiente”.',texto:'Escriba su respuesta.',numero:'Use los botones + y − o escriba el número.',fecha:'Elija el día, el mes y el año.'}[it.tipo];
 let h=`<span class="chip">${n?'Paso '+n+' de 13 · '+esc(secName(n)):'Identificación y soporte legal'}</span><h1 class="q">${esc(it.t)}</h1><button class="btn say" data-a="say">🔊 Escuchar la pregunta</button><p class="hint">${hint}</p>`;
 if(it.op&&it.op.length){if(it.op.length>12)h+=`<input class="inp search" id="sr" enterkeyhint="search" placeholder="🔍 Escriba aquí para buscar…" autocomplete="off">`;
  h+=`<div id="opts" class="opts ${it.op.length>8?'col':'grid'}">${optsHtml(it)}</div>`}
 else if(it.tipo==='numero')h+=`<div class="num"><button class="pill" data-a="dec" aria-label="Menos">−</button><input class="inp" id="in" inputmode="numeric" value="${esc(v??'')}"><button class="pill" data-a="inc" aria-label="Más">+</button></div>`;
 else if(it.tipo==='fecha')h+=dateView(it);
 else h+=`<input class="inp" id="in" enterkeyhint="done" type="${it.n===20?'email':'text'}" ${it.n===19?'inputmode="tel"':''} value="${esc(v??'')}" autocomplete="off">`;
 return h}

function foot(){const it=by[cur],f=$('#foot');if(!f)return;const ok=valid(it);
 f.innerHTML=(ok?'':'<p class="need">Responda para poder continuar</p>')+'<div class="row"><button class="btn back" data-a="back">← Atrás</button><button class="btn next" data-a="next"'+(ok?'':' disabled')+'>Siguiente →</button></div>'}

const iso2es=s=>s?s.split('-').reverse().join('/'):'';
const show=it=>{const v=ans[it.k];return Array.isArray(v)?v.join(', '):it.tipo==='fecha'?iso2es(v):(v??'')};
function render(){const s=seq(),i=s.indexOf(cur),pct=Math.round(i/(s.length-1)*100);let m='',foot_='';
 const hd=`<header><div class="bar" role="progressbar" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><button class="pill" data-a="zoom">Letra A+</button></header>`;
 if(cur==='welcome')m=`<div class="center"><p class="step">🤝</p><h1 class="big">Registro de cuidadores</h1><p class="hint">Le haremos unas preguntas, una por una.<br>No hay respuestas buenas ni malas. Tómese el tiempo que necesite.</p><button class="btn next" data-a="next" style="margin:20px 0 0">¡Empezar!</button>${loadDraft()?'<button class="btn back" data-a="resume" style="margin-top:6px">Continuar donde quedé</button>':''}${pend().length?`<p class="warn">Hay ${pend().length} registro(s) guardado(s) esperando internet.</p>`:''}</div>`;
 else if(/^i\d+$/.test(cur)){const n=+cur.slice(1);m=`<div class="center"><p class="step">${n===0?'🪪':n+' / 13'}</p><h1 class="big">${esc(secName(n))}</h1><p class="hint">${n===0?'Primero, unos datos para identificarte.':'Paso '+n+' de 13'}</p><div style="display:flex;gap:12px;margin-top:20px"><button class="btn back" data-a="back">← Atrás</button><button class="btn next" data-a="next" style="margin:0">Continuar →</button></div></div>`}
 else if(cur==='review'){const qs=ALL.filter(x=>x.k[0]==='c'||vis(x)).filter(has);m=`<div class="center"><p class="step">🎉</p><h1 class="big">¡Muy bien, terminamos!</h1><p class="hint">Respondió ${qs.length} preguntas.</p><details><summary>Ver mis respuestas</summary>${qs.map(x=>`<p><b>${esc(x.t)}</b><br>${esc(show(x))}</p>`).join('')}</details><div style="display:flex;gap:12px"><button class="btn back" data-a="back">← Atrás</button><button class="btn next" data-a="send" style="margin:0" ${sending?'disabled':''}>${sending?'Enviando…':'Enviar respuestas'}</button></div></div>`}
 else if(cur==='done'||cur==='queued'){m=`<div class="center"><p class="step">${cur==='done'?'✅':'📥'}</p><h1 class="big">${cur==='done'?'¡Gracias! Respuestas enviadas':'Guardado en la tablet'}</h1><p class="hint">${cur==='done'?'Ya puede entregar la tableta.':D.cfg.url.startsWith('PEGA')?'Falta configurar la URL de Google Apps Script (modo prueba).':'No hubo internet. Se enviará solo cuando vuelva la conexión.'}</p><button class="btn next" data-a="reset" style="margin:20px 0 0">Nuevo registro</button></div>`}
 else{m=qView(by[cur]);foot_=`<footer id="foot"></footer>`}
 $('#app').innerHTML=hd+`<main>${m}</main>`+foot_;foot();saveDraft();
 const sr=$('#sr');if(sr)sr.oninput=()=>$('#opts').innerHTML=optsHtml(by[cur],sr.value)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,it=by[cur];
 if(a==='next')step(1);else if(a==='back')step(-1);else if(a==='say')say(it.t);
 else if(a==='zoom'){zoom=(zoom+1)%3;document.documentElement.style.fontSize=[100,125,150][zoom]+'%'}
 else if(a==='reset'){ans={};for(const k in dparts)delete dparts[k];clearDraft();sending=false;go('welcome')}
 else if(a==='resume'){const d=loadDraft();if(d){ans=d.ans;go(seq().includes(d.cur)?d.cur:'welcome')}}
 else if(a==='send')submit();
 else if(a==='inc'||a==='dec'){ans[it.k]=Math.max(0,(+ans[it.k]||0)+(a==='inc'?1:-1));$('#in').value=ans[it.k];foot()}
 else if(a==='opt'){const o=it.op[+b.dataset.i];
  if(it.tipo==='checkbox'){let v=ans[it.k]||[];if(v.includes(o))v=v.filter(x=>x!==o);else v=NIN.test(o)?[o]:[...v.filter(x=>!NIN.test(x)),o];ans[it.k]=v.length?v:undefined;if(!v.length)delete ans[it.k]}
  else ans[it.k]=o;
  clean();const sr=$('#sr');$('#opts').innerHTML=optsHtml(it,sr?sr.value:'');foot()}});
document.addEventListener('input',e=>{if(e.target.id!=='in')return;const it=by[cur];ans[it.k]=e.target.value;if(it.tipo==='numero'){ans[it.k]=e.target.value.replace(/\D/g,'');e.target.value=ans[it.k]}foot()});
document.addEventListener('change',e=>{const k=e.target.dataset.d;if(!k)return;const it=by[cur],p=dparts[cur];p[k]=e.target.value;const{y,m,d}=p;
 const dt=new Date(+y,+m-1,+d);if(y&&m&&d&&dt.getMonth()===+m-1&&dt<=new Date())ans[cur]=`${y}-${m}-${d}`;else delete ans[cur];foot()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!/^(in|sr)$/.test(e.target.id))return;e.preventDefault();if(e.target.id==='in'&&valid(by[cur]))step(1);else e.target.blur()});
// Teclado en celular: mantener visible lo que se escribe
const isTxt=el=>el&&el.matches&&el.matches('input.inp');
const keep=()=>{const el=document.activeElement;if(isTxt(el))el.scrollIntoView({block:'center',behavior:'smooth'})};
document.addEventListener('focusin',e=>{if(isTxt(e.target)){document.body.classList.add('typing');setTimeout(keep,350)}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isTxt(document.activeElement))document.body.classList.remove('typing')},150));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(keep,100));

// ---- Envío a Google Sheets (con cola offline) ----
const saveDraft=()=>{try{if(!['welcome','done','queued'].includes(cur))localStorage.setItem('sispro_draft',JSON.stringify({ans,cur}))}catch(e){}};
const loadDraft=()=>{try{return JSON.parse(localStorage.getItem('sispro_draft'))}catch(e){return null}};
const clearDraft=()=>{try{localStorage.removeItem('sispro_draft')}catch(e){}};
const pend=()=>{try{return JSON.parse(localStorage.getItem('sispro_pend')||'[]')}catch(e){return[]}};
const savePend=a=>{try{localStorage.setItem('sispro_pend',JSON.stringify(a))}catch(e){}};
async function post(rec){if(D.cfg.url.startsWith('PEGA'))return false;try{const r=await fetch(D.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});return !!(await r.json()).ok}catch(e){return false}}
async function flush(){const left=[];for(const r of pend())if(!await post(r))left.push(r);savePend(left)}
async function submit(){sending=true;render();const fila={};
 ALL.forEach(x=>{fila[x.col]=(x.k[0]==='c'||vis(x))?show(x):''});
 const rec={id:Date.now()+'-'+Math.random().toString(36).slice(2,8),hoja:D.cfg.hoja,fila};
 const ok=await post(rec);if(!ok)savePend([...pend(),rec]);clearDraft();sending=false;go(ok?'done':'queued')}
addEventListener('online',flush);flush();render();
</script></body></html>
