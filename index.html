<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Registro de cuidadores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{--bg:#1d1450;--ink:#14123a;--soft:#e1dcff;--ok:#157a32;--r:22px;--a:#ffd23f;--al:#ffd23f;--a-ink:#14123a;--b:#fff0b0;--c:#ffe27a;--ta:#ffffff14;--tb:#ffffff0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font:700 1.25rem/1.45 Nunito,system-ui,sans-serif}
#app{max-width:960px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:14px;padding:16px 0}
.bar{flex:1;height:18px;background:#ffffff2e;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#ffd23f;border-radius:10px;transition:width .4s}
.pill{border:0;background:#ffffff2e;color:#fff;border-radius:30px;min-height:52px;padding:0 20px;font:inherit;font-size:1.05rem;cursor:pointer}
main{flex:1;padding:6px 0 20px}
.chip{display:inline-block;background:#ffffff1f;border-radius:30px;padding:6px 16px;color:var(--soft);font-size:1rem}
h1.q{font-size:clamp(1.7rem,5vw,2.6rem);line-height:1.22;margin:.45em 0;font-weight:900}
.hint{color:var(--soft);margin:12px 0 20px;font-size:1.15rem}
.opts{display:grid;gap:14px}.opts.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}.opts.col{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:16px;min-height:88px;padding:16px 20px;background:#fff;color:var(--ink);border:4px solid #fff;border-radius:var(--r);font:inherit;font-size:1.35rem;font-weight:800;text-align:left;cursor:pointer;box-shadow:0 5px 0 #0004}
.opt:active{transform:translateY(3px)}
.mark{flex:none;width:2.3rem;height:2.3rem;border:4px solid var(--ink);display:grid;place-items:center;font-size:1.5rem;color:transparent}
.mark.ci{border-radius:50%}.mark.sq{border-radius:8px}
.opt.sel{background:var(--ok);border-color:#ffd23f;color:#fff}.opt.sel .mark{background:#fff;border-color:#fff;color:var(--ok)}
.inp{width:100%;font:inherit;font-size:1.5rem;font-weight:800;padding:16px 18px;border-radius:var(--r);border:4px solid transparent;background:#fff;color:var(--ink)}
.inp{scroll-margin:90px 0}body.typing main{padding-bottom:50vh}body.typing footer{position:static}
.inp:focus{border-color:#ffd23f;outline:0}.search{margin-bottom:16px}

/* Selector de Fecha adaptado para celular y letra grande */
.dates{display:grid;grid-template-columns:1fr 1.5fr 1.15fr;gap:12px}
.dfield{display:flex;flex-direction:column;gap:6px;min-width:0}
.dfield label{font-size:1.05rem;color:var(--soft);font-weight:900;padding-left:6px}
.dates select.inp{min-width:0;width:100%;padding:16px 12px;font-size:1.35rem;text-overflow:ellipsis}
@media(max-width:600px){
  .dates{grid-template-columns:1fr 1fr}
  .dfield.mes{grid-column:1/-1}
}

.num{display:flex;gap:12px;align-items:center}.num .pill{width:90px;height:90px;font-size:2.6rem;border-radius:var(--r);padding:0}.num .inp{text-align:center;font-size:2.6rem}
footer{position:sticky;bottom:0;padding:16px 0;background:linear-gradient(#1d145000,var(--bg) 30%)}
footer .row{display:flex;gap:12px}.need{margin:0 0 10px;color:#e1dcff;text-align:center;font-size:1.1rem}
.btn{min-height:74px;padding:0 28px;border:0;border-radius:var(--r);font:inherit;font-size:1.4rem;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0004}
.next{background:#1fa044;color:#fff;flex:1}.next:disabled{background:#ffffff1f;color:#fff9;box-shadow:none;cursor:default}
.back{background:#ffffff2e;color:#fff;min-width:130px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60dvh;gap:12px}
.big{font-size:clamp(2.1rem,7vw,3.6rem);font-weight:900;line-height:1.12;margin:0}
.step{font-size:4.5rem;margin:0}.warn{background:#ffd23f;color:var(--ink);padding:12px 18px;border-radius:var(--r);font-weight:800}
details{background:#ffffff14;border-radius:var(--r);padding:14px 18px;margin:14px 0;text-align:left;width:100%}
details p{margin:.5em 0;font-weight:600}details b{color:#fff}

/* Tarjetas guiadas para documentos y personas mayores */
.guide-card{background:#ffffff14;border:3px solid var(--al);border-radius:var(--r);padding:20px;margin-top:16px}
.guide-card.ok{border-color:#25c252;background:#157a3233}
.guide-step{display:inline-block;background:var(--a);color:var(--a-ink);padding:4px 14px;border-radius:20px;font-size:1rem;font-weight:900;margin-bottom:8px}
.guide-card.ok .guide-step{background:#fff;color:#0f6b2a}
.guide-title{font-size:1.45rem;font-weight:900;margin:4px 0 8px}
.guide-desc{color:var(--soft);font-size:1.15rem;margin:0 0 16px}
.svg-wrap{background:#ffffff12;border-radius:18px;padding:14px;margin:0 auto 16px;text-align:center;max-width:340px}
.doc-svg{width:100%;max-width:290px;height:auto;display:block;margin:0 auto}
.doc-svg.sm{max-width:170px}
.mode-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:20px;background:#fff;color:var(--ink);border:4px solid #fff;border-radius:var(--r);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0004}
.mode-card:active{transform:translateY(3px)}
.mode-card .m-t{font-size:1.35rem;font-weight:900}
.mode-card .m-s{font-size:1.05rem;font-weight:600;color:#3d3a66}
.change-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#ffffff14;padding:10px 16px;border-radius:16px;margin-bottom:14px;flex-wrap:wrap;font-size:1.05rem}
.link-btn{background:#ffffff29;color:#fff;border:0;border-radius:14px;padding:8px 14px;font:inherit;font-size:1rem;font-weight:800;cursor:pointer}
.big-action{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:80px;padding:16px 20px;background:#fff;color:var(--ink);border:0;border-radius:20px;font:inherit;font-size:1.35rem;font-weight:900;cursor:pointer;box-shadow:0 6px 0 var(--a)}
.big-action:active{transform:translateY(2px)}
.alt-action{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;margin-top:12px;padding:12px 18px;background:#ffffff24;color:#fff;border:2px solid #ffffff4d;border-radius:18px;font:inherit;font-size:1.15rem;font-weight:800;cursor:pointer}
.alt-action:active{transform:translateY(2px)}
.prev{margin-top:12px;background:#00000040;border-radius:16px;padding:14px;text-align:center}
.prev img{max-width:100%;max-height:240px;border-radius:12px;display:block;margin:0 auto 12px;object-fit:contain;background:#fff}
.pdf-box{padding:18px;background:#fff;color:var(--ink);border-radius:12px;margin-bottom:12px;font-weight:900;font-size:1.15rem}
.del-btn{background:#d93838;color:#fff;border:0;border-radius:14px;padding:12px 20px;font:inherit;font-size:1.05rem;font-weight:800;cursor:pointer}
.chk-card{margin-top:18px;background:var(--ta);border:3px solid var(--al);border-radius:var(--r);padding:16px}
.chk-card .opt{min-height:84px;font-size:1.25rem}
.rule-box{background:var(--ta);border-left:8px solid var(--al);padding:14px 18px;border-radius:14px;margin:12px 0;font-size:1.15rem}
.doc-list{text-align:left;background:#ffffff14;border-radius:var(--r);padding:16px 22px;margin:10px 0;width:100%;max-width:560px}
.doc-list li{margin:10px 0;font-size:1.2rem;display:flex;gap:12px;align-items:center}

.th-ced{--a:#ffd23f;--al:#ffd23f;--a-ink:#14123a;--b:#fff0b0;--c:#ffe27a;--ta:#ffd23f26;--tb:#ffd23f0d;--sw:#ffd23f}
.th-cert{--a:#3f6c9e;--al:#8db6e6;--a-ink:#fff;--b:#a9b4c4;--c:#ffd23f;--ta:#5b86b52e;--tb:#a9b4c41a;--sw:linear-gradient(180deg,#3f6c9e 0 40%,#a9b4c4 40% 75%,#ffd23f 75%)}
.th-med{--a:#1f8a47;--al:#6fd08e;--a-ink:#fff;--b:#bfe8cb;--c:#0b6b8f;--ta:#1f8a4733;--tb:#1f8a470d;--sw:#1f8a47}
.th-ext{--a:#4a62d8;--al:#a3b1ff;--a-ink:#fff;--b:#8a5cf0;--c:#d9d2ff;--ta:#4a62d833;--tb:#8a5cf026;--sw:linear-gradient(180deg,#4a62d8 50%,#8a5cf0 50%)}
.th-all{--a:#6c5ce0;--al:#c4bbff;--a-ink:#fff;--b:#c4bbff;--c:#e1dcff;--ta:#6c5ce033;--tb:#ffffff0d;--sw:linear-gradient(180deg,#ffd23f 0 25%,#3f6c9e 25% 50%,#1f8a47 50% 75%,#8a5cf0 75%)}
.doc-svg text{font-family:Nunito,Arial,sans-serif;font-weight:900;fill:#14123a}
.doc-svg text.hd{fill:var(--a-ink)}
.doc-svg .t1{fill:var(--a)}.doc-svg .t2{fill:var(--b)}.doc-svg .t3{fill:var(--c)}
.doc-hero{border-radius:var(--r);padding:16px 18px 14px;background:linear-gradient(120deg,var(--ta),var(--tb));border:3px solid var(--al);margin:8px 0 6px}
.doc-hero h1.q{margin:.3em 0 0}
.sw{flex:none;width:14px;align-self:stretch;min-height:28px;border-radius:8px;background:var(--sw)}
.role{padding:.02em .32em;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.role.pcd{background:#5fd0e82e;color:#a5ebfa;border-bottom:3px solid #5fd0e8}
.role.cuid{background:#ff9ec42e;color:#ffc4da;border-bottom:3px dashed #ff9ec4}
.opt .role.pcd,.mode-card .role.pcd,.pdf-box .role.pcd{background:#d7f4fb;color:#0a5a6d}
.opt .role.cuid,.mode-card .role.cuid,.pdf-box .role.cuid{background:#ffe1ee;color:#8a1f52}
.whos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px;font-size:1.05rem;color:var(--soft)}
.who{border-radius:30px;padding:6px 16px;font-weight:900;font-size:1.05rem}
.who.pcd{background:#5fd0e8;color:#06323d}
.who.cuid{background:#ff9ec4;color:#4a0f2a}
.mode-switch{margin-top:6px}
.mode-card.compact{flex-direction:row;text-align:left;gap:16px;padding:14px 16px}
.mode-card.compact .doc-svg{width:100px;max-width:100px;flex:none;margin:0}
.mc-txt{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.m-tag{display:inline-block;margin-top:4px;padding:5px 14px;border-radius:20px;font-size:1rem;font-weight:900}
.mode-card.chosen{border-color:var(--al);box-shadow:0 6px 0 var(--a)}
.mode-card.chosen .m-tag{background:var(--a);color:var(--a-ink)}
.mode-card.other{background:#ffffff1f;color:#fff;border:3px dashed #ffffff80;box-shadow:none}
.mode-card.other .m-s{color:var(--soft)}
.mode-card.other .m-tag{background:#fff;color:var(--ink)}
.route-card{display:flex;align-items:center;gap:16px;width:100%;min-height:110px;padding:18px 20px;background:#fff;color:var(--ink);border:4px solid #fff;border-radius:var(--r);font:inherit;text-align:left;cursor:pointer;box-shadow:0 5px 0 #0004}
.route-card:active{transform:translateY(3px)}
.route-card.chosen{border-color:#25c252}
.r-num{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:900}
.r-ico{flex:none;font-size:2.6rem;line-height:1}
.r-txt{display:flex;flex-direction:column;gap:4px}
.route-card .m-t{font-size:1.5rem;font-weight:900}
.route-card .m-s{font-size:1.1rem;font-weight:600;color:#3d3a66}
:focus-visible{outline:4px solid #ffd23f;outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const secName=n=>{

  let t=SEC[n].replace(/\s+OK$/,'').toLowerCase();

};
const vis=q=>{const c=D.cond[q.n];if(!c)return true;const p=byN[c[0]];return vis(p)&&ans[p.k]===c[1]};

function seq(){
  const docs=route==='manual'?DOCS.map(d=>d.k):route==='pdf'?[DOC_ALL.k]:[];
  const s=['welcome','i0',...C.map(c=>c.k),'idoc',...docs];
  for(let n=1;n<=13;n++){
    s.push('i'+n);
    Q.filter(q=>q.sec===n&&vis(q)).forEach(q=>s.push(q.k));
  }
  return [...s,'review'];
}

function docSlots(d){
  const st=ans[d.k]||{};
  if(d.slotsByMode)return st.mode?d.slotsByMode(st.mode):[];
  if(d.fixedSlots)return d.fixedSlots;
  if(d.singleSlot){
    const arr=[d.singleSlot];
    if(d.optionalSlot)arr.push({...d.optionalSlot,opt:true});
    return arr;
  }
  if(!st.mode)return [];
  if(st.mode.includes('lado y lado')){
    return [
      {id:'frente',label:'Parte DELANTERA (de adelante)',desc:'Mire el dibujo: tome foto donde está la foto y el nombre.',svg:SVG.idFront},
      {id:'reverso',label:'Parte TRASERA (de atrás)',desc:'Ahora dele la vuelta: tome foto donde está la huella y el código.',svg:SVG.idBack}
    ];
  }
  return [
    {id:'ambas',label:'Fotocopia o PDF (ambos lados)',desc:'Suba el archivo PDF o tome foto a la hoja donde están ambos lados.',svg:SVG.idSheet,preferFile:true}
  ];
}

function validDoc(d){
  const st=ans[d.k]||{};
  const files=docFiles[d.k]||{};
  if(d.modeCards && !st.mode)return false;
  const slots=docSlots(d);
  if(!slots.length)return false;
  for(const sl of slots){
    if(!sl.opt && !files[sl.id])return false;
  }
  if(d.verifyText && !st.verified)return false;
  return true;
}

const valid=it=>{
  if(!it)return true;
  if(docBy[it.k])return validDoc(it);
  const v=ans[it.k];
  if(v===undefined||(Array.isArray(v)?!v.length:String(v).trim()===''))return false;
  if(it.n===20)return /\S+@\S+\.\S+/.test(v);
  if(it.n===19)return String(v).replace(/\D/g,'').length>=7;
  return true;
};
const has=it=>{const v=ans[it.k];return Array.isArray(v)?v.length>0:v!==undefined&&String(v).trim()!==''};

function qView(it){
  const v=ans[it.k],n=it.sec;
  const hint={checkbox:'Puede marcar varias opciones. Cuando termine, toque “Siguiente”.',select_unico:'Toque su respuesta y luego “Siguiente”.',radio:'Toque su respuesta y luego “Siguiente”.',texto:'Escriba su respuesta en el cuadro blanco.',numero:'Use los botones + y − o escriba el número.',fecha:'Toque cada recuadro para elegir día, mes y año.'}[it.tipo];
  const initRole=it.n<0?(it.n>=-3?['pcd']:['cuid']):[];
  let h=`<span class="chip">${n?'Parte '+n+' de 13 · '+esc(secName(n)):'Datos iniciales'}</span>`;
  h+=`<h1 class="q">${hl(esc(it.t))}</h1>`;
  if(initRole.length)h+=whoHtml(initRole,'Datos de:');
  h+=`<p class="hint">${hint}</p>`;
  if(it.op&&it.op.length){
    if(it.op.length>12)h+=`<input class="inp search" id="sr" enterkeyhint="search" placeholder="🔍 Escriba aquí para buscar…" autocomplete="off">`;
    h+=`<div id="opts" class="opts ${it.op.length>8?'col':'grid'}">${optsHtml(it)}</div>`;
  }
  else if(it.tipo==='numero')h+=`<div class="num"><button class="pill" data-a="dec" aria-label="Menos">−</button><input class="inp" id="in" inputmode="numeric" value="${esc(v??'')}"><button class="pill" data-a="inc" aria-label="Más">+</button></div>`;
  else if(it.tipo==='fecha')h+=dateView(it);
  else h+=`<input class="inp" id="in" enterkeyhint="done" type="${it.n===20?'email':'text'}" ${it.n===19?'inputmode="tel"':''} value="${esc(v??'')}" autocomplete="off">`;
  return h;
}

function foot(){
  const it=by[cur]||docBy[cur],f=$('#foot');if(!f||!it)return;
  const ok=valid(it);
  let msg='Responda para poder continuar';
  if(docBy[cur]){
    const st=ans[cur]||{};
    if(docBy[cur].modeCards && !st.mode)msg='Toque una de las dos opciones de arriba para continuar';
    else if(cur==='doc_all')msg='Suba el PDF con los 5 documentos y marque la confirmación';
    else msg='Complete la foto o archivo y la confirmación para continuar';
  }
  f.innerHTML=(ok?'':`<p class="need">${msg}</p>`)+'<div class="row"><button class="btn back" data-a="back">← Atrás</button><button class="btn next" data-a="next"'+(ok?'':' disabled')+'>Siguiente →</button></div>';
}

const iso2es=s=>s?s.split('-').reverse().join('/'):'';
const show=it=>{const v=ans[it.k];return Array.isArray(v)?v.join(', '):it.tipo==='fecha'?iso2es(v):(v??'')};

function docSummaryText(d){
  const st=ans[d.k]||{};
  const files=docFiles[d.k]||{};
  const nFiles=Object.keys(files).length;
  const parts=[];
  if(st.mode)parts.push(st.mode);
  parts.push(`${nFiles} archivo(s)`);
  if(st.verified)parts.push('Confirmado ✓');
  return parts.join(' · ');
}

function render(){
  const s=seq(),i=s.indexOf(cur),pct=Math.max(0,Math.round(i/(s.length-1)*100));let m='',foot_='';
  const hd=`<header><div class="bar" role="progressbar" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><button class="pill" data-a="zoom">Letra A+</button></header>`;
  if(cur==='welcome'){
    m=`<div class="center"><p class="step">🤝</p><h1 class="big">Registro de cuidadores</h1><p class="hint">Le haremos unas preguntas sencillas sobre la ${hl('persona con discapacidad')} y la ${hl('persona cuidadora')}, y pediremos los documentos.<br>No hay afán, tómese su tiempo.</p><button class="btn next" data-a="next" style="margin:20px 0 0">¡Empezar!</button>${hasDraft?'<button class="btn back" data-a="resume" style="margin-top:6px">Continuar donde quedé</button>':''}${pendList.length?`<p class="warn">Hay ${pendList.length} registro(s) guardado(s) esperando internet.</p>`:''}</div>`;
  }
  else if(cur==='idoc'){
    m=`<div class="center"><p class="step">📂</p><h1 class="big">Entrega de los 5 documentos</h1><p class="hint">Elija cómo prefiere entregar los documentos. Puede cambiar de ruta cuando quiera:</p><div class="opts col" style="width:100%;max-width:640px;text-align:left">${ROUTES.map(r=>`<button type="button" class="route-card${route===r.id?' chosen':''}" data-a="route" data-r="${r.id}"><span class="r-num">${r.n}</span><span class="r-ico">${r.ico}</span><span class="r-txt"><span class="m-t">${esc(r.t)}</span><span class="m-s">${esc(r.s)}</span></span></button>`).join('')}</div><details style="max-width:640px"><summary>Ver los 5 documentos que se piden</summary><ol class="doc-list" style="background:none;padding:6px 0 0;margin:0">${DOCS.map(d=>`<li class="${esc(d.th)}"><span class="sw"></span><span><b>${hl(esc(d.shortName))}</b></span></li>`).join('')}</ol></details><div style="display:flex;gap:12px;margin-top:12px"><button class="btn back" data-a="back">← Atrás</button>${route?'<button class="btn next" data-a="next" style="margin:0">Continuar →</button>':''}</div></div>`;
  }
  else if(/^i\d+$/.test(cur)){
    const n=+cur.slice(1);
    const sub=n===0
      ?`Primero, unos datos básicos de la ${hl('persona con discapacidad')} y de la ${hl('persona cuidadora')}.`
      :'Parte '+n+' de 13 del cuestionario';
    m=`<div class="center"><p class="step">${n===0?'🪪':n+' / 13'}</p><h1 class="big">${esc(secName(n))}</h1><p class="hint">${sub}</p><div style="display:flex;gap:12px;margin-top:20px"><button class="btn back" data-a="back">← Atrás</button><button class="btn next" data-a="next" style="margin:0">Continuar →</button></div></div>`;
  }
  else if(cur==='review'){
    const qs=ALL.filter(x=>x.k[0]==='c'||vis(x)).filter(has);
    let docSec='';
    if(route==='manual'){
      const docsHtml=DOCS.map(d=>`<p><b>${hl(esc(d.t))}</b><br>${esc(docSummaryText(d))}</p>`).join('');
      docSec=`<details open><summary>Documentos guardados (5 · Ruta manual)</summary>${docsHtml}</details>`;
    }else if(route==='pdf'){
      docSec=`<details open><summary>Documento guardado (Ruta PDF)</summary><p><b>${esc(DOC_ALL.t)}</b><br>${esc(docSummaryText(DOC_ALL))}</p></details>`;
    }else{
      docSec=`<details open><summary>Entrega de documentos (Ruta automática)</summary><p>Sin archivos adjuntos. Se enviarán únicamente las respuestas del formulario.</p></details>`;
    }
    const lead=route==='manual'?`Ya están listos los 5 documentos y sus ${qs.length} respuestas.`
      :route==='pdf'?`Ya está listo el PDF con los documentos y sus ${qs.length} respuestas.`
      :`Ya están listas sus ${qs.length} respuestas (Ruta automática).`;
    m=`<div class="center"><p class="step">🎉</p><h1 class="big">¡Muy bien, terminamos!</h1><p class="hint">${lead}</p>${docSec}<details><summary>Ver respuestas (${qs.length})</summary>${qs.map(x=>`<p><b>${hl(esc(x.t))}</b><br>${esc(show(x))}</p>`).join('')}</details><div style="display:flex;gap:12px"><button class="btn back" data-a="back">← Atrás</button><button class="btn next" data-a="send" style="margin:0" ${sending?'disabled':''}>${sending?'Enviando…':'Enviar registro'}</button></div></div>`;
  }
  else if(cur==='done'||cur==='queued'){
    m=`<div class="center"><p class="step">${cur==='done'?'✅':'📥'}</p><h1 class="big">${cur==='done'?'¡Gracias! Registro enviado':'Guardado en el dispositivo'}</h1><p class="hint">${cur==='done'?'Ya puede entregar la tableta o cerrar esta ventana.':D.cfg.url.startsWith('PEGA')?'Falta configurar la URL de Google Apps Script (modo prueba).':'No hubo internet. Se enviará automáticamente cuando vuelva la conexión.'}</p><button class="btn next" data-a="reset" style="margin:20px 0 0">Nuevo registro</button></div>`;
  }
  else if(docBy[cur]){
    m=docView(docBy[cur]);
    foot_=`<footer id="foot"></footer>`;
  }
  else{
    m=qView(by[cur]);
    foot_=`<footer id="foot"></footer>`;
  }
  $('#app').innerHTML=hd+`<main>${m}</main>`+foot_;
  foot();
  saveDraft();
  const sr=$('#sr');if(sr)sr.oninput=()=>$('#opts').innerHTML=optsHtml(by[cur],sr.value);
  bindFileInputs();
}

function processFile(file,opts={}){
  return new Promise((resolve,reject)=>{
    const maxMB=opts.maxMB||6;
    if(opts.pdfOnly && file.type!=='application/pdf'){
      alert('Por favor seleccione un archivo en formato PDF.');
      return reject();
    }
    if(file.type==='application/pdf'){
      if(file.size>maxMB*1024*1024){alert(`El PDF pesa más de ${maxMB} MB. Por favor suba uno más liviano.`);return reject();}
      const r=new FileReader();
      r.onload=()=>resolve({name:file.name,mime:'application/pdf',dataUrl:r.result});
      r.onerror=reject;
      r.readAsDataURL(file);
      return;
    }
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1400;
        let w=img.width,h=img.height;
        if(w>MAX||h>MAX){
          if(w>h){h=Math.round(h*MAX/w);w=MAX;}
          else{w=Math.round(w*MAX/h);h=MAX;}
        }
        const cv=document.createElement('canvas');
        cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=cv.toDataURL('image/jpeg',0.78);
        resolve({name:(file.name||'foto').replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',dataUrl});
      };
      img.onerror=reject;
      img.src=ev.target.result;
    };
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

let activeSlot=null, activeOpts={};
function bindFileInputs(){
  const handler=async e=>{
    const f=e.target.files&&e.target.files[0];
    if(!f||!activeSlot||!docBy[cur])return;
    try{
      const processed=await processFile(f,activeOpts);
      docFiles[cur]=docFiles[cur]||{};
      docFiles[cur][activeSlot]=processed;
      render();
    }catch(err){console.error(err);}
    e.target.value='';
  };
  const cIn=$('#camIn'),fIn=$('#fileIn'),pIn=$('#pdfIn');
  if(cIn)cIn.onchange=handler;
  if(fIn)fIn.onchange=handler;
  if(pIn)pIn.onchange=handler;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,it=by[cur],d=docBy[cur];
  if(a==='next')step(1);
  else if(a==='back')step(-1);
  else if(a==='goroute')go('idoc');
  else if(a==='route'){
    route=b.dataset.r;
    step(1);
  }
  else if(a==='zoom'){zoom=(zoom+1)%3;document.documentElement.style.fontSize=[100,115,130][zoom]+'%'}
  else if(a==='reset'){ans={};docFiles={};route=null;for(const k in dparts)delete dparts[k];clearDraft();sending=false;go('welcome')}
  else if(a==='resume'){resumeDraft()}
  else if(a==='send')submit();
  else if(a==='inc'||a==='dec'){ans[it.k]=Math.max(0,(+ans[it.k]||0)+(a==='inc'?1:-1));$('#in').value=ans[it.k];foot()}
  else if(a==='opt'){
    const o=it.op[+b.dataset.i];
    if(it.tipo==='checkbox'){let v=ans[it.k]||[];if(v.includes(o))v=v.filter(x=>x!==o);else v=NIN.test(o)?[o]:[...v.filter(x=>!NIN.test(x)),o];ans[it.k]=v.length?v:undefined;if(!v.length)delete ans[it.k]}
    else ans[it.k]=o;
    clean();const sr=$('#sr');$('#opts').innerHTML=optsHtml(it,sr?sr.value:'');foot();
  }
  else if(a==='dmode'&&d){
    const mc=d.modeCards[+b.dataset.i];
    ans[d.k]=ans[d.k]||{};
    if(ans[d.k].mode!==mc.val){ans[d.k].mode=mc.val;docFiles[d.k]={};delete ans[d.k].verified;}
    render();
  }
  else if(a==='pick'&&d){
    activeSlot=b.dataset.slot;
    const sl=docSlots(d).find(x=>x.id===activeSlot)||{};
    activeOpts={maxMB:sl.maxMB||6,pdfOnly:!!sl.pdfOnly||b.dataset.pdf==='1'};
    const inp=activeOpts.pdfOnly?$('#pdfIn'):(b.dataset.cam==='1'?$('#camIn'):$('#fileIn'));
    if(inp)inp.click();
  }
  else if(a==='deldoc'&&d){
    if(docFiles[d.k])delete docFiles[d.k][b.dataset.slot];
    if(ans[d.k])delete ans[d.k].verified;
    render();
  }
  else if(a==='dver'&&d){
    ans[d.k]=ans[d.k]||{};
    ans[d.k].verified=!ans[d.k].verified;
    render();
  }
});

document.addEventListener('input',e=>{if(e.target.id!=='in')return;const it=by[cur];ans[it.k]=e.target.value;if(it.tipo==='numero'){ans[it.k]=e.target.value.replace(/\D/g,'');e.target.value=ans[it.k]}foot()});
document.addEventListener('change',e=>{const k=e.target.dataset.d;if(!k)return;const it=by[cur],p=dparts[cur];p[k]=e.target.value;const{y,m,d}=p;const dt=new Date(+y,+m-1,+d);if(y&&m&&d&&dt.getMonth()===+m-1&&dt<=new Date())ans[cur]=`${y}-${m}-${d}`;else delete ans[cur];foot()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!/^(in|sr)$/.test(e.target.id))return;e.preventDefault();if(e.target.id==='in'&&valid(by[cur]))step(1);else e.target.blur()});

const isTxt=el=>el&&el.matches&&el.matches('input.inp');
const keep=()=>{const el=document.activeElement;if(isTxt(el))el.scrollIntoView({block:'center',behavior:'smooth'})};
document.addEventListener('focusin',e=>{if(isTxt(e.target)){document.body.classList.add('typing');setTimeout(keep,350)}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(!isTxt(document.activeElement))document.body.classList.remove('typing')},150));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>setTimeout(keep,100));

let hasDraft=false;
function openDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open('sispro_cuidadores_db',1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore('kv');
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function dbGet(k){try{const db=await openDB();return await new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return null;}}
async function dbSet(k,v){try{const db=await openDB();await new Promise((res,rej)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(v,k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}catch(e){}}

async function saveDraft(){
  if(['welcome','done','queued'].includes(cur))return;
  await dbSet('draft',{ans,docFiles,cur,route});
  hasDraft=true;
}
async function clearDraft(){await dbSet('draft',null);hasDraft=false;}
async function resumeDraft(){
  const d=await dbGet('draft');
  if(d){ans=d.ans||{};docFiles=d.docFiles||{};route=d.route||null;go(seq().includes(d.cur)?d.cur:'welcome');}
}

async function post(rec){
  if(D.cfg.url.startsWith('PEGA'))return false;
  try{
    const r=await fetch(D.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)});
    return !!(await r.json()).ok;
  }catch(e){return false;}
}

async function flush(){
  const list=(await dbGet('pend'))||[];
  if(!list.length){pendList=[];return;}
  const left=[];
  for(const r of list)if(!await post(r))left.push(r);
  await dbSet('pend',left);
  pendList=left;
  if(cur==='welcome')render();
}

async function submit(){
  sending=true;render();
  const fila={};
  ALL.forEach(x=>{fila[x.col]=(x.k[0]==='c'||vis(x))?show(x):''});
  const docsPayload=[];
  if(route==='manual'){
    DOCS.forEach(d=>{
      const files=docFiles[d.k]||{};
      fila[d.col]=docSummaryText(d);
      Object.entries(files).forEach(([slotId,f])=>{
        const ext=f.mime==='application/pdf'?'pdf':'jpg';
        docsPayload.push({
          col:d.col,
          nombreArchivo:`${d.k}_${slotId}.${ext}`,
          mimeType:f.mime,
          base64:f.dataUrl.split(',')[1]||''
        });
      });
    });
  }else if(route==='pdf'){
    const f=(docFiles[DOC_ALL.k]||{}).ambas;
    DOCS.forEach((d,i)=>{
      fila[d.col]=i===0?`Ruta PDF · ${docSummaryText(DOC_ALL)}`:'Incluido en PDF único (Ruta PDF)';
    });
    if(f){
      docsPayload.push({
        col:DOC_ALL.col,
        nombreArchivo:'documentos_completos.pdf',
        mimeType:'application/pdf',
        base64:f.dataUrl.split(',')[1]||''
      });
    }
  }else{
    DOCS.forEach(d=>{fila[d.col]='Ruta automática (sin adjuntos)';});
  }
  const rec={
    id:Date.now()+'-'+Math.random().toString(36).slice(2,8),
    hoja:D.cfg.hoja,
    fila,
    docs:docsPayload
  };
  const ok=await post(rec);
  if(!ok){
    const list=(await dbGet('pend'))||[];
    list.push(rec);
    await dbSet('pend',list);
    pendList=list;
  }
  await clearDraft();
  sending=false;
  go(ok?'done':'queued');
}

(async()=>{
  const d=await dbGet('draft');
  hasDraft=!!d;
  pendList=(await dbGet('pend'))||[];
  render();
  flush();
})();
addEventListener('online',flush);
</script></body></html>
